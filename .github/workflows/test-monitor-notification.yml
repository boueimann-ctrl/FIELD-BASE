
name: FIELD BASE Issue Notification Test

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: field-base-issue-notification-test
  cancel-in-progress: false

jobs:
  test-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated test report
        run: |
          mkdir -p data-monitor

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          report = {
              "checked_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "total_fields": 1,
              "monitored": 1,
              "missing_url": 0,
              "baseline": 0,
              "changed": 1,
              "unchanged": 0,
              "needs_review": 1,
              "results": [
                  {
                      "id": "monitor-notification-test",
                      "name": "【TEST】通知機能の動作確認",
                      "url": (
                          "https://github.com/"
                          "boueimann-ctrl/FIELD-BASE"
                      ),
                      "status": "changed"
                  }
              ]
          }

          path = Path("data-monitor/report.json")
          path.write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("テスト用レポートを作成しました。")
          PY

      - name: Test GitHub Issue notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/monitor/notify_github.py
