
name: FIELD BASE Auto Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 2"

permissions:
  contents: write

concurrency:
  group: field-base-auto-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect verified field data
        working-directory: frontend
        run: python3 scripts/collector/collect_fields.py

      - name: Check generated JSON
        working-directory: frontend
        run: |
          python3 -m json.tool src/data/generated/fieldAutoData.json > /dev/null

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/generated/fieldAutoData.json

          if git diff --cached --quiet; then
            echo "No verified data changes"
            exit 0
          fi

          git commit -m "data: update verified field information"
          git push
